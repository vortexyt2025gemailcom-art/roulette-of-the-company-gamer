<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="connect-src 'self'"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0d0b1e">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruleta</title>
<style>
:root{--bg:#0d0b1e;--g:#ffc83d;--m:#9b97c4;--c:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#f4f2ff;font:600 16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(900px 600px at 50% -10%,#2a1f6b,transparent 70%),radial-gradient(700px 500px at 100% 100%,#6b1d5a55,transparent 70%),var(--bg)}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .25s,filter .2s,opacity .25s}
button:active{transform:scale(.94)}
button:disabled{opacity:.45;pointer-events:none}
/* carga */
#ld{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;background:linear-gradient(#1b1450,#0d0b1e);border-radius:0 0 50% 50%/0 0 70px 70px;box-shadow:0 24px 70px #000b;transition:transform 1.2s cubic-bezier(.77,0,.18,1);will-change:transform}
#ld.up{transform:translateY(-112%)}
.sp{position:relative;width:130px;height:130px;border-radius:50%;border:6px solid #fff3;background:repeating-conic-gradient(#ff4d6d 0 45deg,#ffc83d 0 90deg,#38bdf8 0 135deg,#7c5cff 0 180deg);box-shadow:0 0 50px #7c5cff88;animation:rot 1.1s linear infinite;will-change:transform}
.sp:after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--bg);border:4px solid var(--g)}
@keyframes rot{to{transform:rotate(1turn)}}
.pc{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}
.br{width:min(240px,70vw);height:8px;border-radius:8px;background:#ffffff1a;overflow:hidden}
.br i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#7c5cff,#ff4d9d,#ffc83d)}
/* app */
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));opacity:0;transform:scale(.95);transition:opacity .9s .55s,transform 1s .55s cubic-bezier(.2,.8,.2,1)}
body.ok #app{opacity:1;transform:none}
h1{font-size:20px;letter-spacing:3px;opacity:.85}
#wb{position:relative;width:var(--S,300px);height:var(--S,300px)}
#wh{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 7px #ffffff14,0 16px 60px #7c5cff66;will-change:transform}
#pt{transform-origin:50% 25%;position:absolute;left:50%;top:-20px;width:38px;height:46px;margin-left:-19px;z-index:3;filter:drop-shadow(0 3px 5px #000a)}
#hb{position:absolute;left:50%;top:50%;width:15%;height:15%;transform:translate(-50%,-50%);border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 30%,#fff,#ffc83d 45%,#c98a00);box-shadow:0 0 0 5px #fff4,0 4px 18px #000a}
#go{padding:16px 58px;border-radius:40px;font-size:22px;font-weight:800;letter-spacing:3px;background:linear-gradient(135deg,#7c5cff,#ff4d9d);box-shadow:0 8px 34px #7c5cff77}
#go:hover{filter:brightness(1.12)}
.r{display:flex;gap:10px;align-items:center}
.sm{padding:11px 20px;border-radius:30px;background:var(--c);border:1px solid #fff2}
.sm:hover{background:#ffffff18}
/* paneles */
#bd{position:fixed;inset:0;z-index:20;background:#0009;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
#bd.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:auto;padding:20px 20px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;border-radius:26px 26px 0 0;background:#171335;border:1px solid #fff2;transform:translateY(106%);transition:transform .55s cubic-bezier(.2,.9,.2,1);max-height:90%;overflow:auto}
.sh.open{transform:none}
.sh h2{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.x{width:34px;height:34px;border-radius:50%;background:var(--c);font-size:18px}
.lb{font-size:13px;color:var(--m)}
.in{width:100%;padding:13px 15px;border-radius:14px;border:1px solid #fff2;background:#ffffff0f;outline:0;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:#7c5cff;box-shadow:0 0 0 3px #7c5cff44}
select.in option{background:#171335}
.fl{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;border-style:dashed}
.fl button{width:28px;height:28px;border-radius:50%;background:var(--c)}
#fF{display:none}
#ok{padding:14px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#ff4d9d);font-weight:800}
#ls{display:flex;flex-wrap:wrap;gap:8px;max-height:130px;overflow:auto}
.ch{display:flex;align-items:center;gap:6px;padding:4px 5px 4px 10px;border-radius:20px;background:var(--c);font-size:14px}
.ch img{width:24px;height:24px;border-radius:50%;object-fit:cover;margin-left:-6px}
.ch button{width:22px;height:22px;border-radius:50%;background:#ffffff1a;font-size:14px;line-height:1}
/* ganador y efectos */
#wo{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#050310aa;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s}
#wo.on{opacity:1}
#wc{max-width:92vw;transform:scale(.35) rotate(-8deg);opacity:0;transition:transform .8s cubic-bezier(.2,1.35,.3,1),opacity .4s;box-shadow:0 0 90px #ffc83d66;border-radius:28px}
#wo.on #wc{transform:none;opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
#ts{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:60;padding:11px 18px;border-radius:24px;background:#000d;border:1px solid #fff3;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.9,.2,1);max-width:90vw;text-align:center}
#ts.on{opacity:1;transform:translate(-50%,0)}
#tb{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center}
#cp{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 10px;border-radius:30px;background:var(--c);border:1px solid #fff2}
#cp b{font-variant-numeric:tabular-nums;min-width:28px}
#cP{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#a3e635);color:#06280f;font-size:20px;font-weight:800;line-height:1}
#an{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 54px);left:50%;transform:translateX(-50%);z-index:9;max-width:92vw;padding:8px 16px;border-radius:20px;background:linear-gradient(135deg,#ff4d9d,#7c5cff);box-shadow:0 6px 24px #0006;font-size:14px;text-align:center}
#an[hidden]{display:none}
#hz{position:fixed;right:0;bottom:0;width:64px;height:64px;z-index:15;opacity:0;background:none}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;display:none}
#bt{position:relative;padding-right:8px}
#bt:after{content:"";position:absolute;right:0;top:30%;bottom:30%;width:8px;border-radius:0 5px 5px 0;background:#ffffff66}
#go{position:relative;overflow:hidden}
#go span{position:relative;z-index:1}
#go:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#16a34a,#a3e635);transform:scaleX(var(--f,0));transform-origin:left;transition:transform var(--d,6s) linear;will-change:transform}
#go.run{background:#241f4d;box-shadow:0 8px 34px #16a34a66}
#go.run:disabled{opacity:1}
#wb{isolation:isolate}
#wb:before{content:"";position:absolute;inset:-16px;border-radius:50%;background:var(--ring,none);filter:blur(7px);opacity:0;transition:opacity .6s;z-index:-1;animation:rot 5s linear infinite;will-change:transform}
#wb.dc:before{opacity:1}
.tabs .sm{flex:1;padding:10px 6px;font-size:14px}.tabs .on{background:#7c5cff}
#gr,#pk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px;border-radius:16px;background:var(--c);border:1px solid #fff2;font-size:14px;text-align:left}
#pk .it{align-items:center;text-align:center;padding:16px}
.pv{height:62px;border-radius:12px;background-size:cover;background-position:center;border:1px solid #fff3}
.it>button{padding:9px;border-radius:12px;background:#7c5cff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.it>button.u{background:#ffffff1f}.it>button.e{background:#16a34a}
.ok2{padding:14px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#ff4d9d);font-weight:800}
textarea.in{resize:none}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shk{animation:sk .35s}
[hidden]{display:none!important}
.sm,#cp,#ck{text-shadow:0 1px 3px #0006}
#app .r{flex-wrap:wrap;justify-content:center}
#tb .r{flex-wrap:nowrap;gap:8px}#tb .sm{padding:10px 12px}
#bE{display:flex;align-items:center}
#ck{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 50px);left:12px;z-index:10;padding:5px 12px;border-radius:20px;background:var(--c);border:1px solid #fff2;font-size:13px;font-variant-numeric:tabular-nums}
.gone{display:none!important}.invis{opacity:0!important}
body.lt .sm,body.lt #cp,body.lt #ck{background:#0000004d}
.tabs2 .sm{flex:1;padding:10px 6px;font-size:13px}.tabs2 .on{background:#7c5cff}
label.ch{padding:8px 12px;cursor:pointer}label.ch input{accent-color:#7c5cff;margin-right:6px}
#eL{display:flex;flex-wrap:wrap;gap:8px}#tB{display:flex;flex-direction:column;gap:10px}
#pk .it>button{align-self:stretch}
#lL{display:flex;flex-direction:column;gap:6px}#lL .in{display:flex;gap:10px;padding:10px 14px}
#nv{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:20px;background:#050310d0;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s}
#nv.on{opacity:1;pointer-events:auto}
#nc{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:440px;max-height:90%;overflow:auto;padding:20px;border-radius:24px;background:#171335;border:2px solid var(--g);box-shadow:0 0 60px #ffc83d44;text-align:center}
#nc img{max-width:100%;max-height:50vh;border-radius:16px}#nc p{font-size:18px;white-space:pre-wrap}
@keyframes hue{0%{filter:hue-rotate(0) brightness(1.15)}25%{filter:hue-rotate(90deg) brightness(.65)}50%{filter:hue-rotate(180deg) brightness(1.3)}75%{filter:hue-rotate(270deg) brightness(.65)}100%{filter:hue-rotate(360deg) brightness(1.15)}}
#wh.anim{animation:hue 5s linear infinite}
.cf{position:fixed;z-index:55;pointer-events:none;opacity:0;animation:cf 1.5s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes cf{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1;transform:translate(0,-30px) scale(1.15)}100%{transform:translate(var(--x),var(--y)) scale(.5) rotate(var(--r));opacity:0}}
.pl{position:fixed;left:50%;top:34%;z-index:56;font-size:64px;font-weight:900;color:#ffd23f;text-shadow:0 4px 24px #ff9d00,0 0 40px #ffb300;pointer-events:none;animation:pl 1.9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pl{0%{opacity:0;transform:translate(-50%,40px) scale(.4)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}70%{opacity:1;transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(-50%,-80px) scale(.9)}}
#wb.hw #hb{background:radial-gradient(circle at 35% 30%,#555,#111);box-shadow:0 0 0 5px #ff7a00,0 0 26px #ff7a00}
#wb.hw #hb:after{content:"💀";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--S) * .075)}
#wb.hw:after{content:"🕸️ 🦇";position:absolute;left:-12px;top:-14px;font-size:38px;z-index:3;pointer-events:none;filter:drop-shadow(0 0 6px #ff7a00)}
#uB,#qL{display:flex;flex-direction:column;gap:10px}
/* ===== pulido ===== */
:root{--g:#ffd479;--c:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--ease:cubic-bezier(.22,.9,.24,1)}
html,body{font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
button{transition:transform .35s var(--ease),box-shadow .35s,background .3s,filter .3s,opacity .3s}
#ld{gap:28px;background:radial-gradient(700px 520px at 50% 38%,#2a1f6b,#0d0b1e 72%);border-radius:0;box-shadow:none;transition:opacity 1s ease,transform 1.2s var(--ease),visibility 0s 1.1s}
#ld.up{transform:scale(1.05);opacity:0;visibility:hidden}
.sp{width:92px;height:92px;border:0;background:conic-gradient(#ffd479,#ff5fa8,#8b6bff,#38bdf8,#ffd479);box-shadow:none;-webkit-mask:radial-gradient(circle,#0000 58%,#000 60%);mask:radial-gradient(circle,#0000 58%,#000 60%);animation:rot 2.2s linear infinite}
.sp:after{display:none}
.lt{font-size:15px;font-weight:300;letter-spacing:.9em;text-indent:.9em;color:#fffc}
.br{width:min(200px,56vw);height:2px;border-radius:2px;background:#ffffff18}
.br i{width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#8b6bff,#ff5fa8,#ffd479);box-shadow:0 0 14px #ff5fa8aa}
.pc{font-size:13px;font-weight:300;letter-spacing:.2em;color:#fff9}
.sm,#cp,#ck,.it,.ch{background:var(--c);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 1px 0 #ffffff1f,0 6px 20px #0003}
.sm{font-size:14px}
.sm:hover,.it:hover{background:#ffffff14;transform:translateY(-1px)}
#cp{padding:8px 18px 8px 12px}
#go{padding:17px 64px;font-size:20px;font-weight:700;letter-spacing:6px;text-indent:6px;background:linear-gradient(135deg,#8b6bff,#ff5fa8);box-shadow:inset 0 1px 0 #fff5,0 10px 36px #8b6bff66;animation:bre 3.2s ease-in-out infinite}
#go.run,#go:disabled{animation:none}
@keyframes bre{50%{box-shadow:inset 0 1px 0 #fff5,0 12px 54px #ff5fa899}}
#wh{box-shadow:0 0 0 1px #ffffff26,0 0 0 8px #ffffff0d,0 24px 80px #7c5cff55}
.sh{background:rgba(22,18,52,.78);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 -20px 70px #0008;padding-top:28px;transition:transform .7s var(--ease)}
.sh:before{content:"";position:absolute;top:10px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:#ffffff33}
.sh h2{font-size:19px;font-weight:700}
.in{background:#ffffff0d;border:1px solid var(--line);border-radius:16px}
.in:focus{border-color:#a592ff;box-shadow:0 0 0 4px #7c5cff3d}
.ok2,#ok{background:linear-gradient(135deg,#8b6bff,#ff5fa8);box-shadow:inset 0 1px 0 #fff4,0 8px 24px #8b6bff55;border-radius:16px}
.it>button.e{background:linear-gradient(135deg,#22c55e,#84cc16)}
#bd{background:#04020f99;backdrop-filter:blur(8px);transition:opacity .5s}
#ts{background:rgba(20,16,46,.84);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 12px 40px #0006;font-size:14px}
#app{gap:24px;transition:opacity 1s .3s,transform 1.1s .3s var(--ease)}
body.ok #app .r>*,body.ok #tb>*{animation:rise .8s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#app .r>:nth-child(2){animation-delay:.07s}#app .r>:nth-child(3){animation-delay:.14s}
#lkz{position:fixed;inset:0;z-index:49;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:24px;background:radial-gradient(700px 520px at 50% 30%,#2a1f6b,#0d0b1e 75%);opacity:0;transition:opacity .5s}
#lkz.on{opacity:1}#lkz .in,#lkz .ok2{width:100%;max-width:320px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

#cp{padding:6px 6px 6px 14px}
a.ok2{display:block;text-align:center;text-decoration:none;color:#fff;padding:14px;font-weight:800}
.pay{display:flex;align-items:center;gap:10px}.pay span{color:var(--m);font-size:13px;min-width:96px}.pay b{flex:1;font-size:17px;letter-spacing:.5px}.pay .sm{padding:7px 14px}
.warn{border-color:#ffd47999;background:#ffd4791a;line-height:1.45;font-size:14px}
#lkz{overflow:auto;justify-content:safe center}

/* v3: rendimiento (sin desenfoques pesados) */
.sm,#cp,#ck,.it,.ch,#ts,.sh,#bd,#wo,#nv{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.sh{background:#171335f5!important}.sm,#cp,#ck,.it,.ch{background:#ffffff14}
#go{animation:none!important}
/* carga: ruleta */
.sp{width:112px;height:112px;border-radius:50%;background:repeating-conic-gradient(#ff4d6d 0 30deg,#ffc83d 0 60deg,#38bdf8 0 90deg,#7c5cff 0 120deg);-webkit-mask:none;mask:none;animation:none;box-shadow:0 0 0 5px #ffffff2e,0 0 44px #7c5cff77}
.sp:after{display:block}
/* fondo que se mueve */
body{background:none!important}
#bga{position:fixed;inset:-22%;z-index:-1;pointer-events:none;will-change:transform;animation:bgf 24s ease-in-out infinite alternate}
@keyframes bgf{to{transform:translate3d(5%,4%,0) rotate(7deg) scale(1.22)}}
/* flecha, centro, nombre sin cuadro */
#pe{position:absolute;left:50%;top:-46px;transform:translateX(-50%);font-size:24px;z-index:4;pointer-events:none}
#hb:after{content:var(--he,"");position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--S)*.075)}
#wc{box-shadow:none!important;border-radius:0!important}
#sP .tabs{flex-wrap:wrap}#sP .tabs .sm{flex:1 1 30%;font-size:13px}
#bl{display:flex;flex-direction:column;gap:10px}#rc{margin-top:6px}
/* ===== radio ===== */
#rd{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));z-index:16;width:min(92vw,380px);transform:translateX(-50%);display:flex;justify-content:center}
body.clean #rd,body.clean #rb{display:none}
#rb{position:fixed;right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 50px);z-index:16;width:58px;height:58px;padding:0;border-radius:50%;background:none;opacity:0;transition:opacity .9s .5s,transform .35s var(--ease)}
body.ok #rb{opacity:1}
#rb img{display:block;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 4px 10px #0009)}
#rb.in2{animation:rbi .6s var(--ease) backwards}
.rhi{display:block;width:36px;height:36px}
@media(max-height:670px){#rb{width:50px;height:50px}}
@keyframes rbi{from{transform:scale(.15);opacity:0}}
#rp{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 56px 10px 10px;border-radius:20px;background:#1d1745;border:1px solid var(--line);box-shadow:0 10px 30px #0007;cursor:pointer;animation:rpi .55s var(--ease) backwards;transition:transform .45s var(--ease),opacity .45s}
#rp.out{transform:translateX(120%);opacity:0}
@keyframes rpi{from{transform:translateX(-120%);opacity:0}}
.rcv{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:#ffffff1a}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt small{color:var(--m);font-size:12px}
#rp .x{position:absolute;top:50%;right:10px;margin-top:-18px;width:36px;height:36px;background:#ffffff24}
.rpg,.rb2{height:5px;border-radius:5px;background:#ffffff1f;overflow:hidden}.rb2{height:10px}
.rpg i,.rb2 i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#8b6bff,#ff5fa8,#ffd479)}.rb2 i{transition:width .2s}
#rV,#rU,#rL{display:flex;flex-direction:column;gap:10px}
.sg2{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:#ffffff0f;border:1px solid var(--line)}
.sg2 .rcv{width:46px;height:46px;border-radius:12px}
.sg2 button{width:40px;height:40px;border-radius:50%;background:var(--c);font-size:17px;flex:none}
.sg2 .sv.on{background:#16a34a}.sg2 .pp{background:linear-gradient(135deg,#8b6bff,#ff5fa8)}
#rU .fl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

<script>

const $=s=>document.querySelector(s),TAU=Math.PI*2,wh=$('#wh'),fx=$('#fx'),fc=fx.getContext('2d');
const dpr=()=>Math.min(devicePixelRatio||1,2),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let items=[],angle=0,busy=false,uid=0,file=null;
['David','María','Carlos','Ana','Luis','Sofía'].forEach(n=>items.push({id:++uid,name:n}));

/* ---- carga suave ---- */
(function(){const pc=$('#pc'),bar=$('#bar'),sp=document.querySelector('.sp');let p=0,a=0,v=1,tg=1,nt=0,l=performance.now();
 (function L(t){const dt=Math.min(50,t-l);l=t;if(t>nt){tg=[.25,.5,1,1.6,2.6,3.4][Math.random()*6|0];nt=t+250+Math.random()*450}
  v+=(tg-v)*Math.min(1,dt/120);a+=v*dt*.3;p=Math.min(100,p+v*dt*.024);
  sp.style.transform='rotate('+a+'deg)';pc.textContent=p|0;bar.style.transform='scaleX('+p/100+')';
  p<100?requestAnimationFrame(L):setTimeout(()=>{$('#ld').classList.add('up');document.body.classList.add('ok')},350)})(l)})();

/* ---- dibujar ruleta ---- */
function draw(){
 const S=Math.floor(document.body.classList.contains('clean')?Math.min(innerWidth*.98,innerHeight*.74,900):Math.min(innerWidth*.9,innerHeight*.5,520)),d=dpr(),n=items.length;
 $('#wb').style.setProperty('--S',S+'px');
 wh.width=wh.height=S*d;const x=wh.getContext('2d');x.scale(d,d);
 const c=S/2,R=c-5,seg=TAU/(n||1);
 if(!n){x.fillStyle='#ffffff12';x.beginPath();x.arc(c,c,R,0,TAU);x.fill();x.fillStyle='#9b97c4';x.font='700 '+S*.05+'px system-ui';x.textAlign='center';x.fillText('Agrega con “＋ Más”',c,c+S*.12);return}
 st.rs==='f'&&PH&&(x.save(),x.beginPath(),x.arc(c,c,R,0,TAU),x.clip(),x.drawImage(PH,0,0,S,S),x.restore());
 items.forEach((it,i)=>{
  const a0=-Math.PI/2+i*seg;
  x.beginPath();x.moveTo(c,c);x.arc(c,c,R,a0,a0+seg);x.closePath();
  x.fillStyle=segColor(i,n);x.fill();
  if(n<400){x.strokeStyle='#ffffff55';x.lineWidth=1.5;x.stroke()}
  const arc=R*.9*seg;if(arc<7)return;
  x.save();x.translate(c,c);x.rotate(a0+seg/2);let tx=R*.93;
  if(it.img){const r=Math.min(R*.13,arc*.42);
   x.save();x.beginPath();x.arc(tx-r,0,r,0,TAU);x.clip();x.drawImage(it.img,tx-r*2,-r,r*2,r*2);x.restore();
   x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(tx-r,0,r,0,TAU);x.stroke();tx-=r*2+7}
  if(it.name){let f=Math.min(arc*.55,R*.1);const mw=tx-R*(WS[st.rs]&&WS[st.rs][2]==='hw'?.42:.2);x.font=`800 ${f}px system-ui,sans-serif`;
   const w=x.measureText(it.name).width;if(w>mw)f*=mw/w;
   if(f>=6){x.font=`800 ${f}px system-ui,sans-serif`;x.fillStyle=segText(i,n);x.textAlign='right';x.textBaseline='middle';x.shadowColor='#0008';x.shadowBlur=4;x.fillText(it.name,tx,0)}}
  x.restore()});
 rim(x,c,R,n,seg);
}

/* ---- giro ---- */
async function spin(){
 if(busy||!items.length)return;busy=true;batt(1);
 const n=items.length,seg=TAU/n,i=Math.random()*n|0,j=(Math.random()-.5)*.7;
 const base=((-(i+.5+j)*seg)%TAU+TAU)%TAU,cur=(angle%TAU+TAU)%TAU;
 const sp=Math.min(120,Math.max(1,+$('#sT').value||6));
 const delta=((base-cur)%TAU+TAU)%TAU+Math.max(4,Math.round(sp*1.3))*TAU,a0=angle,t0=performance.now();
 await new Promise(r=>{(function f(t){const k=Math.min(1,Math.max(0,(t-t0)/(sp*1000)));
  angle=a0+delta*(1-Math.pow(1-k,4));wh.style.transform=`rotate(${angle}rad)`;pegs(angle,seg);k<1?requestAnimationFrame(f):r()})(t0)});
 const w=st.keep?items[i]:items.splice(i,1)[0];draw();list();
 await reveal(w);busy=false;batt(0);list();
}

/* ---- tarjeta del ganador ---- */
function card(w){
 const W=Math.min(innerWidth*.86,520),H=w.img?(w.name?W*1.02:W*.74):W*.46,d=dpr(),c=$('#wc'),x=c.getContext('2d');
 c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';x.scale(d,d);
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#3b2a8f');g.addColorStop(1,'#a02a86');
 
 let ty=H/2;
 if(w.img){const r=W*.27,cy=r+W*.1;x.save();x.beginPath();x.arc(W/2,cy,r,0,TAU);x.clip();x.drawImage(w.img,W/2-r,cy-r,r*2,r*2);x.restore();
  x.lineWidth=5;x.strokeStyle='#ffc83d';x.beginPath();x.arc(W/2,cy,r,0,TAU);x.stroke();ty=cy+r+(H-cy-r)/2}
 if(w.name){let f=W*.12;x.font=`800 ${f}px system-ui,sans-serif`;const m=x.measureText(w.name).width,mw=W*.86;
  if(m>mw){f*=mw/m;x.font=`800 ${f}px system-ui,sans-serif`}
  x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#000c';x.shadowBlur=18;x.fillText(w.name,W/2,ty)}
}
async function reveal(w){
 const wo=$('#wo'),wc=$('#wc');wc.style.cssText='';card(w);wo.classList.add('on');
 await sleep(380);const b=wc.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
 burst(cx,cy,1);setTimeout(()=>burst(cx,cy,.6),380);
 const sec=Math.max(.5,+$('#sS').value||5)*($('#sU').value==='m'?60:1);
 await sleep(sec*1000);
 let m=$('#sE').value;if(m==='r')m='fbshq'[Math.random()*5|0];
 if(m==='f'){wc.style.transition='opacity 2.6s ease,transform 2.6s ease';wc.style.opacity=0;wc.style.transform='scale(.92) translateY(12px)';await sleep(2650)}
 else if(m==='h'||m==='q'){const q=m==='q';wc.style.transition=q?'filter 1.3s,opacity 1.1s .9s,transform 2.2s':'opacity 2.4s ease-out,filter 2.4s ease-out,transform 2.4s ease-out';void wc.offsetWidth;wc.style.filter=q?'brightness(.25) sepia(1) saturate(6) hue-rotate(-25deg)':'blur(18px) grayscale(1) brightness(1.7)';wc.style.opacity=0;wc.style.transform=q?'scale(.88) translateY(24px)':'scale(1.5) translateY(-80px)';if(q)coinsUp(cx,cy);else burst(cx,cy,.4);await sleep(2500)}else{shatter(wc,m==='s'?26:9);wc.style.visibility='hidden';await sleep(2000)}
 wo.classList.remove('on');await sleep(500);wc.style.cssText='';void wc.offsetWidth;
}

/* ---- chispas y pedazos (un solo bucle, todo por tiempo) ---- */
let P=[],Sh=[],run=false,lt=0;
function size(){const d=dpr();fx.width=innerWidth*d;fx.height=innerHeight*d;fc.setTransform(d,0,0,d,0,0)}
function go(){if(!run){run=true;lt=performance.now();requestAnimationFrame(loop)}}
function burst(x,y,k){return;for(let i=0;i<170*k;i++){const a=Math.random()*TAU,v=Math.sqrt(Math.random())*(.25+Math.random()*.8)*k,l=700+Math.random()*1200;
 P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.15,l,m:l,s:1+Math.random()*2.6,c:`hsl(${35+Math.random()*30} 100% ${60+Math.random()*30}%)`})}go()}
function shatter(c,cols=9){const b=c.getBoundingClientRect(),rows=Math.max(3,Math.round(cols*b.height/b.width)),
 tw=c.width/cols,th=c.height/rows,w=b.width/cols,h=b.height/rows;
 for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)Sh.push({src:c,sx:q*tw,sy:r*th,sw:tw,sh:th,w,h,x:b.left+(q+.5)*w,y:b.top+(r+.5)*h,
  vx:(Math.random()-.5)*.3+(q-cols/2)*.02,vy:-Math.random()*.25,r:0,vr:(Math.random()-.5)*.007,d:Math.random()*300});go()}
function loop(t){const dt=Math.min(40,t-lt);lt=t;fc.clearRect(0,0,innerWidth,innerHeight);
 fc.globalCompositeOperation='lighter';fc.lineCap='round';
 P=P.filter(q=>{q.l-=dt;if(q.l<=0)return false;q.vy+=.0009*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.993;
  fc.globalAlpha=Math.min(1,q.l/q.m*1.6);fc.strokeStyle=q.c;fc.lineWidth=q.s;
  fc.beginPath();fc.moveTo(q.x-q.vx*dt*2.5,q.y-q.vy*dt*2.5);fc.lineTo(q.x,q.y);fc.stroke();return true});
 fc.globalCompositeOperation='source-over';fc.globalAlpha=1;
 Sh=Sh.filter(s=>{if(s.d>0)s.d-=dt;else{s.vy+=.0016*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=s.vr*dt}
  if(s.y>innerHeight+120)return false;
  fc.save();fc.translate(s.x,s.y);fc.rotate(s.r);fc.drawImage(s.src,s.sx,s.sy,s.sw,s.sh,-s.w/2,-s.h/2,s.w,s.h);fc.restore();return true});
 P.length||Sh.length?requestAnimationFrame(loop):run=false}

/* ---- paneles ---- */
const bd=$('#bd');let cur=null;
function open(id){close();cur=$(id);cur.classList.add('open');bd.classList.add('on')}
function close(){cur&&cur.classList.remove('open');bd.classList.remove('on');cur=null}
$('#bM').onclick=()=>open('#sA');$('#bS').onclick=()=>open('#sC');bd.onclick=close;
document.querySelectorAll('.x').forEach(b=>b.onclick=close);

let tt;function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2300)}

/* ---- agregar: nombre y/o foto de galería ---- */
const OK=/^image\/(jpe?g|png|webp|gif|avif|bmp|heic|heif)$/i,EXT=/\.(jpe?g|png|webp|gif|avif|bmp|heic|heif)$/i;
function clearFile(){file=null;$('#fF').value='';$('#fL').textContent='📷 Elegir foto de la galería';$('#fX').hidden=true}
$('#fF').onchange=e=>{const f=e.target.files[0];if(!f)return clearFile();
 if(!(OK.test(f.type)||(!f.type&&EXT.test(f.name)))){clearFile();return toast('Solo se permiten fotos de la galería')}
 file=f;$('#fL').textContent='✅ '+f.name;$('#fX').hidden=false};
$('#fX').onclick=e=>{e.preventDefault();clearFile()};
async function prep(f){const u=URL.createObjectURL(f),im=new Image();im.src=u;
 try{await im.decode()}finally{URL.revokeObjectURL(u)}
 const s=Math.min(im.naturalWidth,im.naturalHeight),c=document.createElement('canvas');c.width=c.height=256;
 c.getContext('2d').drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,256,256);
 return[c,c.toDataURL('image/jpeg',.7)]}
async function add(){
 if(busy)return toast('Espera a que termine el giro');
 const name=$('#fN').value.trim();if(!name&&!file)return toast('Pon un nombre o elige una foto');
 let img=null,url=null;
 if(file){try{[img,url]=await prep(file)}catch{return toast('No pude leer esa foto, prueba con otra')}}
 items.push({id:++uid,name,img,url});$('#fN').value='';clearFile();draw();list();toast('¡Agregado a la ruleta!')}
$('#ok').onclick=add;$('#fN').onkeydown=e=>e.key==='Enter'&&add();

function list(){const ls=$('#ls');$('#cn').textContent=items.length+' en la ruleta';ls.innerHTML='';
 items.forEach(it=>{const d=document.createElement('div');d.className='ch';
  if(it.url){const i=new Image();i.src=it.url;d.append(i)}
  d.append(it.name||'Foto');
  const b=document.createElement('button');b.textContent='×';
  b.onclick=()=>{if(busy)return toast('Espera a que termine el giro');items.splice(items.indexOf(it),1);draw();list()};
  d.append(b);ls.append(d)});

const rd=$('#rd'),rb=$('#rb');let songs=[],tab='b',fav=[],au=null,pu=[],um='s',urls=[];
try{fav=JSON.parse(localStorage.getItem('ruleta_fav'))||[]}catch{}
const sf=()=>{try{localStorage.setItem('ruleta_fav',JSON.stringify(fav))}catch{}};
/* almacén (IndexedDB, en este dispositivo) */
const db=()=>db.p||(db.p=new Promise((ok,no)=>{const r=indexedDB.open('ruleta_radio',1);r.onupgradeneeded=()=>{r.result.createObjectStore('s',{keyPath:'id'});r.result.createObjectStore('a')};r.onsuccess=()=>ok(r.result);r.onerror=()=>{db.p=0;no(r.error)}}));
const dx=async(st,m,f)=>{const d=await db();return new Promise((ok,no)=>{const t=d.transaction(st,m),q=f(t.objectStore(st));t.oncomplete=()=>ok(q.result);t.onerror=t.onabort=()=>no(t.error)})};
/* lista */
const cov=(b,c)=>{const u=U(b);urls.push(u);return vd(b)?`<video class="${c}" src="${u}#t=.1" muted loop playsinline preload="metadata"></video>`:`<img class="${c}" src="${u}" alt="">`};
function render(){urls.splice(0).forEach(R);
 const q=N($('#rQ').value),l=songs.filter(s=>(tab=='b'||fav.includes(s.id))&&(!q||N(s.name).startsWith(q)||N(s.id).startsWith(q))).sort((a,b)=>a.name.localeCompare(b.name,'es'));
 $('#rL').innerHTML=l.length?l.map(s=>{const f=fav.includes(s.id);return`<div class="sg2">${cov(s.img,'rcv')}<div class="rt"><b>${esc(s.name)}</b><small>ID ${esc(s.id)}</small></div><button class="sv${f?' on':''}" data-i="${esc(s.id)}" aria-label="Guardar">${f?'📑':'📄'}</button><button class="pp" data-p="${esc(s.id)}" aria-label="Reproducir">▶</button></div>`}).join(''):`<div class="lb" style="text-align:center;padding:16px">${tab=='g'?'Aún no guardaste música':songs.length?'No hay resultados':'Todavía no hay música'}</div>`}
$('#rL').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.i!=null){const k=fav.indexOf(d.i);k<0?fav.push(d.i):fav.splice(k,1);sf();toast(k<0?'Guardado con éxito':'Quitado de guardados');render()}
 else if(d.p!=null)play(songs.find(s=>s.id===d.p))};
$('#rT').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;[...$('#rT').children].forEach(x=>x.classList.toggle('on',x==b));render()};
$('#rQ').oninput=render;
const view=f=>{$('#rT').hidden=$('#rV').hidden=!!f;$('#rO').hidden=!!f||!OWN;$('#rU').hidden=!f};
rb.onclick=async()=>{try{songs=await dx('s','readonly',s=>s.getAll())}catch{songs=[];toast('Este dispositivo no permite guardar música')}view(0);render();open('#sR')};
$('#rX').onclick=close;
/* subir (solo dueño) */
async function form(m){um=m;view(1);const s=m=='s';
 $('#uT').textContent=s?'Subir canción':'Subir anuncio';$('#uN').hidden=$('#uAu').hidden=!s;$('#rAdText').hidden=s;
 $('#uCl').textContent=s?'📷 Foto o video':'📷 Foto o video del anuncio';$('#uAl').textContent='🎵 Subir audio';
 ['#uNm','#uId','#rAdText','#uCf','#uAf'].forEach(k=>$(k).value='');
 $('#rProgress').hidden=true;$('#uGo').disabled=false;$('#uGo').textContent='Subir';$('#uDl').hidden=true;
 if(!s){try{$('#uDl').hidden=!await dx('a','readonly',x=>x.get('ad'))}catch{}}}
$('#rS').onclick=()=>form('s');$('#rA').onclick=()=>form('a');$('#rBack').onclick=()=>{view(0);render()};
$('#uCf').onchange=e=>{const f=e.target.files[0];if(f)$('#uCl').textContent='✅ '+f.name};
$('#uAf').onchange=e=>{const f=e.target.files[0];if(f)$('#uAl').textContent='✅ '+f.name};

/* reproductor */
function kill(){if(au){au.pause();au.removeAttribute('src');au.load();au=null}pu.splice(0).forEach(R)}
function play(s){if(!s)return;close();const o=$('#rp');o&&o.remove();kill();
 const a=au=new Audio(),ua=U(s.audio),uc=U(s.img),c=document.createElement('div');pu=[ua,uc];a.src=ua;rb.hidden=true;c.id='rp';
