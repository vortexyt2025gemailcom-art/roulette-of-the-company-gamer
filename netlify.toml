# Configuración de Netlify para la Ruleta
# No hay "build": el sitio es el index.html de la raíz + la función de netlify/functions/api.mjs

[build]
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Que estos archivos del repositorio no se puedan abrir desde el sitio web
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
